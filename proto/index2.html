<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>阅读器APP - 桌面端线框图 (手绘风格)</title>
    <!-- 引入Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入手绘风格字体 -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <style>
      /* 全局手绘风格 */
      body {
        font-family: "Gaegu", cursive;
        background-color: #fdfdfa; /* 纸张背景色 */
        color: #4a4a4a; /* 炭笔/墨水颜色 */
      }

      /* 手绘风格边框 */
      .sketch-border {
        border: 2px solid #4a4a4a;
        border-radius: 4px 6px 5px 3px / 3px 5px 6px 4px;
        box-shadow: 2px 2px 0px 0px rgba(0, 0, 0, 0.1);
      }

      /* 手绘风格的卡片/容器 */
      .sketch-card {
        background-color: #ffffff;
        border: 2px solid #4a4a4a;
        border-radius: 5px 4px 6px 3px / 3px 6px 4px 5px;
      }

      /* 模拟书籍封面的占位符 */
      .wireframe-box {
        background-color: #f3f4f6;
        border: 2px dashed #9ca3af;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        color: #6b7280;
        border-radius: 5px 4px 6px 3px / 3px 6px 4px 5px;
      }

      /* 手绘风格按钮 */
      .sketch-button {
        background-color: #f0f0f0;
        border: 2px solid #4a4a4a;
        border-radius: 6px 4px 5px 3px / 3px 5px 4px 6px;
        box-shadow: 2px 2px 0px 0px rgba(0, 0, 0, 0.1);
        transition: all 0.1s ease-in-out;
        font-weight: 700;
      }
      .sketch-button:hover {
        transform: translate(1px, 1px);
        box-shadow: 1px 1px 0px 0px rgba(0, 0, 0, 0.1);
      }
      .sketch-button-primary {
        background-color: #818cf8; /* 柔和的蓝色 */
        color: white;
      }
      .sketch-button-primary:hover {
        background-color: #6366f1;
      }

      /* 导航选中状态 */
      .nav-item-active {
        background-color: #e0e7ff !important;
        color: #3730a3 !important;
        border-radius: 6px 4px 5px 3px / 3px 5px 4px 6px;
      }

      /* 书籍选中高亮 */
      .book-item-active {
        outline: 2px solid #818cf8;
        outline-offset: 4px;
        border-radius: 8px 6px 7px 5px / 5px 7px 6px 8px;
      }

      /* 隐藏滚动条 */
      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
    </style>
  </head>
  <body class="text-gray-800">
    <div class="flex h-screen bg-transparent">
      <!-- 1. 左侧导航栏 -->
      <aside
        class="w-64 flex-shrink-0 bg-white/50 border-r-2 border-gray-800 flex flex-col"
      >
        <!-- Logo -->
        <div
          class="h-16 flex items-center justify-center font-bold text-2xl border-b-2 border-gray-800"
        >
          阅读器APP
        </div>
        <!-- 导航菜单 -->
        <nav class="flex-grow p-4">
          <ul>
            <li>
              <a
                href="#"
                class="nav-item flex items-center p-3 rounded-lg font-bold text-lg"
                ><svg
                  class="w-5 h-5 mr-3"
                  fill="currentColor"
                  viewBox="0 0 20 20"
                >
                  <path
                    d="M10.707 2.293a1 1 0 00-1.414 0l-7 7a1 1 0 001.414 1.414L4 10.414V17a1 1 0 001 1h2a1 1 0 001-1v-2a1 1 0 011-1h2a1 1 0 011 1v2a1 1 0 001 1h2a1 1 0 001-1v-6.586l.293.293a1 1 0 001.414-1.414l-7-7z"
                  ></path></svg
                >书架</a
              >
            </li>
            <li>
              <a
                href="#"
                class="nav-item flex items-center p-3 rounded-lg hover:bg-gray-200 mt-2 font-bold text-lg"
                ><svg
                  class="w-5 h-5 mr-3"
                  fill="none"
                  stroke="currentColor"
                  viewBox="0 0 24 24"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2"
                    d="M8 16l4-4-4-4m4 4l4-4-4-4"
                  ></path></svg
                >发现</a
              >
            </li>
            <li>
              <a
                href="#"
                class="nav-item flex items-center p-3 rounded-lg hover:bg-gray-200 mt-2 font-bold text-lg"
                ><svg
                  class="w-5 h-5 mr-3"
                  fill="none"
                  stroke="currentColor"
                  viewBox="0 0 24 24"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2"
                    d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"
                  ></path></svg
                >书城</a
              >
            </li>
          </ul>
        </nav>
        <!-- 用户信息 -->
        <div class="p-4 border-t-2 border-gray-800">
          <a
            href="#"
            class="nav-item flex items-center p-3 rounded-lg hover:bg-gray-200 font-bold text-lg"
          >
            <svg
              class="w-6 h-6 mr-3"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"
              ></path>
            </svg>
            <span>我的账户</span>
          </a>
        </div>
      </aside>

      <!-- 2. 中间主内容区 -->
      <main class="flex-1 flex flex-col overflow-hidden">
        <!-- 内容区头部 -->
        <header
          class="h-16 flex-shrink-0 flex items-center justify-between p-4 border-b-2 border-gray-800 bg-transparent"
        >
          <h1 class="text-3xl font-bold">我的书架</h1>
          <div class="flex items-center space-x-4">
            <div class="relative w-64">
              <input
                type="text"
                placeholder="搜索我的书架..."
                class="w-full pl-10 pr-4 py-2 sketch-border bg-white/80 focus:outline-none focus:ring-2 focus:ring-blue-500 text-lg"
              />
              <svg
                class="w-5 h-5 text-gray-400 absolute left-3 top-1/2 -translate-y-1/2"
                fill="none"
                stroke="currentColor"
                viewBox="0 0 24 24"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"
                ></path>
              </svg>
            </div>
            <button class="sketch-button px-4 py-2">排序方式</button>
            <button class="sketch-button px-4 py-2">视图切换</button>
          </div>
        </header>
        <!-- 书籍网格 -->
        <div class="flex-grow p-6 overflow-y-auto no-scrollbar">
          <div
            class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-8"
          >
            <!-- 书籍项模板 -->
            <div class="book-item text-center cursor-pointer group">
              <div
                class="w-full h-48 wireframe-box mb-2 group-hover:scale-105 transition-transform duration-200"
              >
                书籍封面
              </div>
              <p class="font-bold text-lg truncate">很长的书籍名称</p>
              <p class="text-base text-gray-500">作者名</p>
            </div>
            <!-- 重复书籍项... -->
            <div class="book-item text-center cursor-pointer group">
              <div
                class="w-full h-48 wireframe-box mb-2 group-hover:scale-105 transition-transform duration-200"
              >
                书籍封面
              </div>
              <p class="font-bold text-lg truncate">书名</p>
              <p class="text-base text-gray-500">作者名</p>
            </div>
            <div class="book-item text-center cursor-pointer group">
              <div
                class="w-full h-48 wireframe-box mb-2 group-hover:scale-105 transition-transform duration-200"
              >
                书籍封面
              </div>
              <p class="font-bold text-lg truncate">书名</p>
              <p class="text-base text-gray-500">作者名</p>
            </div>
            <div class="book-item text-center cursor-pointer group">
              <div
                class="w-full h-48 wireframe-box mb-2 group-hover:scale-105 transition-transform duration-200"
              >
                书籍封面
              </div>
              <p class="font-bold text-lg truncate">书名</p>
              <p class="text-base text-gray-500">作者名</p>
            </div>
            <div class="book-item text-center cursor-pointer group">
              <div
                class="w-full h-48 wireframe-box mb-2 group-hover:scale-105 transition-transform duration-200"
              >
                书籍封面
              </div>
              <p class="font-bold text-lg truncate">书名</p>
              <p class="text-base text-gray-500">作者名</p>
            </div>
            <!-- 添加书籍按钮 -->
            <div class="text-center">
              <div
                class="w-full h-48 wireframe-box mb-2 cursor-pointer hover:bg-gray-200 flex-col group"
              >
                <svg
                  class="w-10 h-10 text-gray-500 group-hover:scale-110 transition-transform"
                  fill="none"
                  stroke="currentColor"
                  viewBox="0 0 24 24"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2"
                    d="M12 6v6m0 0v6m0-6h6m-6 0H6"
                  ></path>
                </svg>
                <span class="mt-2 text-lg font-bold">添加书籍</span>
              </div>
            </div>
          </div>
        </div>
      </main>

      <!-- 3. 右侧详情/阅读区 -->
      <aside
        class="w-80 flex-shrink-0 border-l-2 border-gray-800 flex flex-col bg-white/50"
      >
        <div class="flex-grow p-6">
          <h2 class="text-2xl font-bold mb-4">继续阅读</h2>
          <div class="sketch-card p-4">
            <div class="w-24 h-36 wireframe-box mx-auto">书籍封面</div>
            <h3 class="font-bold text-xl text-center mt-3">书籍名称</h3>
            <p class="text-base text-gray-500 text-center mt-1">作者名</p>
            <div
              class="w-full bg-gray-200 rounded-full h-2.5 mt-4 sketch-border"
            >
              <div
                class="bg-blue-400 h-1.5 rounded-full"
                style="width: 45%; margin: 2px"
              ></div>
            </div>
            <p class="text-sm text-gray-400 mt-1 text-right">已读 45%</p>
            <button
              class="w-full sketch-button sketch-button-primary py-2 mt-4 text-lg"
            >
              继续阅读
            </button>
          </div>

          <div
            id="book-details"
            class="mt-8 opacity-0 transition-opacity duration-300"
          >
            <h2 class="text-2xl font-bold mb-4">书籍详情</h2>
            <div class="sketch-card p-4 text-lg">
              <p class="text-center text-gray-500">
                点击左侧书架中的一本书<br />来查看详情
              </p>
            </div>
          </div>
        </div>
      </aside>
    </div>

    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const navItems = document.querySelectorAll(".nav-item");
        const bookItems = document.querySelectorAll(".book-item");
        const bookDetailsSection = document.getElementById("book-details");
        const continueReadingSection =
          document.querySelector("aside.w-80 h2").parentElement;

        // 初始化时，高亮第一个导航项
        navItems[0].classList.add("nav-item-active");

        // 模拟左侧导航切换
        navItems.forEach((item) => {
          item.addEventListener("click", (e) => {
            e.preventDefault();
            navItems.forEach((i) => {
              i.classList.remove("nav-item-active");
            });
            item.classList.add("nav-item-active");
            console.log(`导航到: ${item.textContent.trim()}`);
          });
        });

        // 模拟点击书籍显示详情
        bookItems.forEach((item) => {
          item.addEventListener("click", () => {
            const bookTitle = item.querySelector("p").textContent;
            console.log(`选中了书籍: ${bookTitle}`);

            // 更新右侧详情
            continueReadingSection.classList.add("hidden");
            bookDetailsSection.classList.remove("opacity-0");
            bookDetailsSection.querySelector(
              "p"
            ).innerHTML = `这里显示 <strong class="text-gray-800">${bookTitle}</strong> 的详细信息，例如简介、目录、笔记等。`;

            // 高亮选中的书籍
            bookItems.forEach((i) => i.classList.remove("book-item-active"));
            item.classList.add("book-item-active");
          });
        });
      });
    </script>
  </body>
</html>
