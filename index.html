<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MIDDA</title>
    <!-- 引入Tailwind CSS -->
    <!-- <script src="https://cdn.tailwindcss.com"></script> -->
    <!-- 引入无衬线字体 Public Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@700;900&display=swap"
      rel="stylesheet"
    />
    <style>
      /* 全局昭和复古粗野主义风格 */
      :root {
        --mustard-yellow: #d4a017;
        --brick-red: #b3312c;
        --olive-green: #808000;
        --beige-bg: #f5f5dc;
        --steel-blue: #a0c4e8;
        --black: #3d2b1f; /* 使用深棕色代替纯黑，更具复古感 */
        --white: #ffffff;
      }

      body {
        font-family: "Public Sans", sans-serif;
        font-weight: 700; /* 默认粗体 */
        background-color: var(--beige-bg);
        color: var(--black);
        line-height: 1.2; /* 紧凑行距 */
      }

      /* 粗野主义核心元素：粗边框和硬阴影 */
      .brutalist-element {
        border: 4px solid var(--black);
        border-radius: 20px; /* 夸张的圆角 */
        box-shadow: 6px 6px 0px 0px var(--black); /* 厚重阴影 */
        transition: all 0.1s ease-in-out;
      }

      /* 卡片 */
      .brutalist-card {
        background-color: var(--white);
      }

      /* 按钮 */
      .brutalist-button {
        background-color: var(--mustard-yellow);
        color: var(--white);
        cursor: pointer;
        text-align: center;
        font-weight: 900; /* 更粗的字重 */
        padding: 0.75rem 1.5rem;
      }
      .brutalist-button:hover {
        transform: translate(3px, 3px);
        box-shadow: 3px 3px 0px 0px var(--black);
      }
      .brutalist-button:active {
        transform: translate(6px, 6px);
        box-shadow: 0px 0px 0px 0px var(--black);
      }
      .brutalist-button-primary {
        background-color: var(--brick-red);
        color: var(--white);
      }

      /* 书籍封面占位符 */
      .wireframe-box {
        background-color: var(--white);
        border: 3px dashed var(--black);
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        color: var(--black);
        border-radius: 16px;
      }

      /* 输入框 */
      .brutalist-input {
        background-color: var(--white);
        font-weight: 700;
        padding: 0.5rem 1rem 0.5rem 2.5rem; /* 为图标留出空间 */
      }
      .brutalist-input:focus {
        outline: 4px solid var(--mustard-yellow);
        outline-offset: 2px;
      }

      /* 导航选中状态 */
      .nav-item-active {
        background-color: var(--brick-red) !important;
        color: var(--white) !important;
        border-radius: 16px;
      }

      /* 书籍选中高亮 */
      .book-item-active .wireframe-box {
        outline: 5px solid var(--steel-blue);
        outline-offset: 4px;
      }

      /* 进度条 */
      .progress-bar-bg {
        background-color: var(--white);
      }
      .progress-bar-fill {
        background-color: var(--olive-green);
        height: 100%;
        border-radius: 8px;
      }

      /* 隐藏滚动条 */
      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
    </style>
    <link href="/src/assets/style.css" rel="stylesheet" />
  </head>
  <body class="text-black">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
