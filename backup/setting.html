<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>阅读器APP - 设置页面 (昭和复古粗野主义)</title>
    <!-- 引入Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入无衬线字体 Public Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;700;900&display=swap"
      rel="stylesheet"
    />
    <style>
      /* 全局昭和复古粗野主义风格 */
      :root {
        --mustard-yellow: #d4a017;
        --brick-red: #b3312c;
        --olive-green: #808000;
        --beige-bg: #f5f5dc;
        --steel-blue: #a0c4e8;
        --black: #3d2b1f; /* 复古深棕 */
        --white: #ffffff;
      }

      body {
        font-family: "Public Sans", sans-serif;
        background-color: var(--beige-bg);
        color: var(--black);
      }

      /* 粗野主义核心元素 */
      .brutalist-element {
        border: 4px solid var(--black);
        border-radius: 20px;
        box-shadow: 6px 6px 0px 0px var(--black);
        transition: all 0.1s ease-in-out;
      }

      .brutalist-button {
        background-color: var(--mustard-yellow);
        color: var(--white);
        cursor: pointer;
        text-align: center;
        font-weight: 900;
        padding: 0.5rem 1rem;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .brutalist-button:hover {
        transform: translate(3px, 3px);
        box-shadow: 3px 3px 0px 0px var(--black);
      }
      .brutalist-button:active {
        transform: translate(6px, 6px);
        box-shadow: 0px 0px 0px 0px var(--black);
      }

      /* 设置弹窗样式 */
      .settings-overlay {
        position: fixed;
        inset: 0;
        background-color: rgba(0, 0, 0, 0.5);
        z-index: 100;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1rem;
      }
      .settings-modal {
        width: 100%;
        max-width: 500px;
        background-color: var(--beige-bg);
      }
      .setting-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 1rem 0;
        border-bottom: 4px solid var(--black);
      }
      .setting-row:last-child {
        border-bottom: none;
      }
      .theme-dot {
        width: 40px;
        height: 40px;
        border-radius: 9999px;
        cursor: pointer;
      }
      .theme-dot.active {
        outline: 4px solid var(--black);
        outline-offset: 4px;
      }
    </style>
  </head>
  <body class="w-full h-screen">
    <!-- 设置弹窗 -->
    <div id="settings-overlay" class="settings-overlay">
      <div class="brutalist-element settings-modal">
        <!-- 弹窗头部 -->
        <div
          class="p-4 flex items-center justify-between border-b-4 border-black"
        >
          <h2 class="text-2xl font-black">显示设置</h2>
          <button
            id="close-modal-btn"
            class="brutalist-element brutalist-button"
            style="padding: 0.5rem; box-shadow: 4px 4px 0 0 var(--black)"
          >
            <svg
              class="w-6 h-6"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="3"
                d="M6 18L18 6M6 6l12 12"
              ></path>
            </svg>
          </button>
        </div>
        <!-- 弹窗内容 -->
        <div class="p-6">
          <!-- 字体大小 -->
          <div class="setting-row">
            <span class="text-lg font-bold">字体大小</span>
            <div class="flex items-center space-x-4">
              <button
                class="brutalist-element brutalist-button text-2xl"
                style="padding: 0.25rem 1rem"
              >
                -
              </button>
              <span class="text-xl font-black w-12 text-center">常规</span>
              <button
                class="brutalist-element brutalist-button text-2xl"
                style="padding: 0.25rem 1rem"
              >
                +
              </button>
            </div>
          </div>
          <!-- 行高 -->
          <div class="setting-row">
            <span class="text-lg font-bold">行高</span>
            <div class="flex items-center space-x-4">
              <button
                class="brutalist-element brutalist-button text-2xl"
                style="padding: 0.25rem 1rem"
              >
                -
              </button>
              <span class="text-xl font-black w-12 text-center">1.8</span>
              <button
                class="brutalist-element brutalist-button text-2xl"
                style="padding: 0.25rem 1rem"
              >
                +
              </button>
            </div>
          </div>
          <!-- 主题 -->
          <div class="setting-row">
            <span class="text-lg font-bold">主题</span>
            <div class="flex items-center space-x-4">
              <div
                class="theme-dot active brutalist-element"
                style="background-color: var(--beige-bg); box-shadow: none"
              ></div>
              <div
                class="theme-dot brutalist-element"
                style="background-color: #c1e1c1; box-shadow: none"
              ></div>
              <div
                class="theme-dot brutalist-element"
                style="background-color: #f0e68c; box-shadow: none"
              ></div>
              <div
                class="theme-dot brutalist-element"
                style="background-color: #1e1e1e; box-shadow: none"
              ></div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script>
      // 在独立页面中，可以添加模拟交互的JS
      document.addEventListener("DOMContentLoaded", () => {
        const closeModalBtn = document.getElementById("close-modal-btn");
        if (closeModalBtn) {
          closeModalBtn.addEventListener("click", () => {
            alert("关闭按钮被点击！在实际应用中，这里会关闭弹窗。");
          });
        }

        const themeDots = document.querySelectorAll(".theme-dot");
        themeDots.forEach((dot) => {
          dot.addEventListener("click", () => {
            themeDots.forEach((d) => d.classList.remove("active"));
            dot.classList.add("active");
            console.log("主题已切换");
          });
        });
      });
    </script>
  </body>
</html>
